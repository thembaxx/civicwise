name: CivicWise quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
  shared-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: civicwise
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: civicwise_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U civicwise -d civicwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
        env:
          TEST_DATABASE_URL: postgresql://civicwise:ci-test-only@127.0.0.1:5432/civicwise_test
      - run: node --conditions=react-server --experimental-strip-types --test tests/auth-session.integration.test.ts
        env:
          AUTH_TEST_DATABASE_URL: postgresql://civicwise:ci-test-only@127.0.0.1:5432/civicwise_test
